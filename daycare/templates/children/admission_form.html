{% extends "base.html" %}
{% load static %}

{% block title %}Student Admission Form{% endblock %}

{% block content %}
    <h1 class="fw-bold mb-4 border-bottom pb-3">Admission Form ✏️</h1>
    <p class="lead text-muted">Complete the details below to enroll a new child.</p>

    <div class="card shadow-sm p-4 p-md-5">
        <form method="POST">
            {% csrf_token %}
            <h4 class="mb-4 text-primary">Child Information</h4>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="child_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="child_name" required>
                </div>
                <div class="col-md-6">
                    <label for="child_dob" class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" id="child_dob" required>
                </div>
                <div class="col-md-4">
                    <label for="child_gender" class="form-label">Gender</label>
                    <select class="form-select" id="child_gender">
                        <option selected>Choose...</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
                 <div class="col-md-4">
                    <label for="enroll_class" class="form-label">Enrollment Class</label>
                    <select class="form-select" id="enroll_class" required>
                        <option selected>Choose...</option>
                        <option>Infants</option>
                        <option>Toddlers</option>
                        <option>Pre-K</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="start_date" class="form-label">Start Date</label>
                    <input type="date" class="form-control" id="start_date" required>
                </div>
            </div>

            <h4 class="mb-4 text-primary mt-5">Guardian Information</h4>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="guardian_name" class="form-label">Guardian Name</label>
                    <input type="text" class="form-control" id="guardian_name" required>
                </div>
                <div class="col-md-6">
                    <label for="guardian_phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="guardian_phone" placeholder="(555) 555-5555" required>
                </div>
                <div class="col-12">
                    <label for="guardian_email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="guardian_email" required>
                </div>
                <div class="col-12">
                    <label for="guardian_address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="guardian_address" placeholder="1234 Main St" required>
                </div>
            </div>

            <button type="submit" class="btn btn-success mt-4 py-2 px-5">
                <i class="bi bi-save me-2"></i> Save Admission
            </button>
        </form>
    </div>
{% endblock %}
